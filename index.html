<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor PDF Pro - Inicio</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --accent: #3b82f6;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .hero {
        text-align: center;
        margin-bottom: 4rem;
      }
      h1 {
        font-size: 3.5rem;
        margin: 0;
        background: linear-gradient(to right, #60a5fa, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        color: #94a3b8;
        font-size: 1.2rem;
      }
      .btn {
        background-color: var(--accent);
        color: white;
        border: none;
        padding: 1rem 3rem;
        font-size: 1.1rem;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
      }
      .btn:hover {
        background-color: #2563eb;
        transform: translateY(-2px);
      }
      .history {
        width: 100%;
        max-width: 1000px;
      }
      .history-header {
        border-bottom: 1px solid #334155;
        padding-bottom: 1rem;
        margin-bottom: 2rem;
        color: #64748b;
        font-weight: bold;
        text-transform: uppercase;
        font-size: 0.85rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
      }
      .card {
        background-color: var(--card);
        padding: 1.5rem;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s;
        border: 1px solid #334155;
      }
      .card:hover {
        background-color: #334155;
        transform: scale(1.02);
        border-color: var(--accent);
      }
      .card-name {
        font-weight: 600;
        display: block;
        margin-bottom: 0.5rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 1.1rem;
      }
      .card-path {
        font-size: 0.75rem;
        color: #64748b;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .empty {
        text-align: center;
        color: #475569;
        padding: 4rem;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>Visor PDF Pro</h1>
      <p>Tus documentos, con la mejor experiencia.</p>
      <button id="openBtn" class="btn">Abrir PDF</button>
    </div>

    <div class="history">
      <div class="history-header">Documentos Recientes</div>
      <div id="grid" class="grid"></div>
    </div>

    <script>
      const grid = document.getElementById("grid");
      const openBtn = document.getElementById("openBtn");

      async function renderHistory() {
        const history = await window.electronAPI.getHistory();
        if (history.length === 0) {
          grid.innerHTML =
            '<div class="empty">Tu historial aparecerá aquí cuando abras un archivo.</div>';
          return;
        }
        grid.innerHTML = history
          .map(
            (item) => `
                <div class="card" onclick="openFile('${item.path.replace(/\\/g, "/")}')">
                    <span class="card-name">${item.name}</span>
                    <span class="card-path">${item.path}</span>
                </div>
            `,
          )
          .join("");
      }

      function openFile(path) {
        window.electronAPI.openPDF(path);
      }

      openBtn.addEventListener("click", async () => {
        const result = await window.electronAPI.openFileDialog();
        if (!result.canceled && result.filePaths.length > 0) {
          openFile(result.filePaths[0]);
        }
      });

      renderHistory();
    </script>
  </body>
</html>
