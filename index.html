<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor PDF Pro - Inicio</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --accent: #3b82f6;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .hero {
        text-align: center;
        margin-bottom: 4rem;
      }
      h1 {
        font-size: 3.5rem;
        margin: 0;
        background: linear-gradient(to right, #60a5fa, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        color: #94a3b8;
        font-size: 1.2rem;
      }
      .btn {
        background-color: var(--accent);
        color: white;
        border: none;
        padding: 1rem 3rem;
        font-size: 1.1rem;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
      }
      .btn:hover {
        background-color: #2563eb;
        transform: translateY(-2px);
      }
      .history {
        width: 100%;
        max-width: 1000px;
      }
      .history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #334155;
        padding-bottom: 1rem;
        margin-bottom: 2rem;
        color: #64748b;
        font-weight: bold;
        text-transform: uppercase;
        font-size: 0.85rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
      }
      .card {
        position: relative;
        background-color: var(--card);
        padding: 1.5rem;
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.2s;
        border: 1px solid #334155;
      }
      .card:hover {
        background-color: #334155;
        transform: scale(1.02);
        border-color: var(--accent);
      }
      .remove-card {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        width: 2rem;
        height: 2rem;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: #0f172a;
        color: var(--text);
        font-size: 1.25rem;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s, background-color 0.15s;
      }
      .card:hover .remove-card,
      .remove-card:focus-visible {
        opacity: 1;
      }
      .remove-card:hover {
        background: #dc2626;
      }
      .clear-history {
        border: 1px solid #475569;
        border-radius: 6px;
        padding: 0.5rem 0.75rem;
        background: transparent;
        color: #cbd5e1;
        cursor: pointer;
      }
      .clear-history:hover {
        color: white;
        border-color: #ef4444;
      }
      .card-name {
        font-weight: 600;
        display: block;
        margin-bottom: 0.5rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 1.1rem;
      }
      .card-path {
        font-size: 0.75rem;
        color: #64748b;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .empty {
        text-align: center;
        color: #475569;
        padding: 4rem;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>Visor PDF Pro</h1>
      <p>Tus documentos, con la mejor experiencia.</p>
      <button id="openBtn" class="btn">Abrir PDF</button>
    </div>

    <div class="history">
      <div class="history-header">
        <span>Documentos Recientes</span>
        <button id="clearHistoryBtn" class="clear-history" type="button">Eliminar todos</button>
      </div>
      <div id="grid" class="grid"></div>
    </div>

    <script>
      const grid = document.getElementById("grid");
      const openBtn = document.getElementById("openBtn");
      const clearHistoryBtn = document.getElementById("clearHistoryBtn");

      async function renderHistory() {
        const history = await window.electronAPI.getHistory();
        clearHistoryBtn.hidden = history.length === 0;
        grid.replaceChildren();
        if (history.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Tu historial aparecerá aquí cuando abras un archivo.";
          grid.append(empty);
          return;
        }

        for (const item of history) {
          const card = document.createElement("div");
          card.className = "card";
          card.addEventListener("click", () => openFile(item.path));

          const name = document.createElement("span");
          name.className = "card-name";
          name.textContent = item.name;

          const filePath = document.createElement("span");
          filePath.className = "card-path";
          filePath.textContent = item.path;

          const removeButton = document.createElement("button");
          removeButton.className = "remove-card";
          removeButton.type = "button";
          removeButton.setAttribute("aria-label", `Eliminar ${item.name} del historial`);
          removeButton.title = "Eliminar del historial";
          removeButton.textContent = "×";
          removeButton.addEventListener("click", async (event) => {
            event.stopPropagation();
            await window.electronAPI.removeHistoryItem(item.path);
            renderHistory();
          });

          card.append(removeButton, name, filePath);
          grid.append(card);
        }
      }

      function openFile(path) {
        window.electronAPI.openPDF(path);
      }

      openBtn.addEventListener("click", async () => {
        const result = await window.electronAPI.openFileDialog();
        if (!result.canceled && result.filePaths.length > 0) {
          openFile(result.filePaths[0]);
        }
      });

      clearHistoryBtn.addEventListener("click", async () => {
        await window.electronAPI.clearHistory();
        renderHistory();
      });

      renderHistory();
    </script>
  </body>
</html>
