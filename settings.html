<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajustes - PDF Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      body {
        margin: 0;
        padding: 2.5rem;
      }
      h1 {
        margin: 0;
        font-size: 1.8rem;
      }
      p {
        color: #94a3b8;
      }
      fieldset {
        margin: 2rem 0 0;
        padding: 1.25rem;
        border: 1px solid #334155;
        border-radius: 8px;
      }
      legend {
        padding: 0 0.5rem;
        font-weight: 600;
      }
      label {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 0;
        cursor: pointer;
      }
      input[type="radio"] {
        accent-color: #3b82f6;
      }
      .save-toast {
        position: fixed;
        z-index: 1;
        top: 1rem;
        left: 50%;
        width: min(360px, calc(100vw - 2rem));
        overflow: hidden;
        border: 1px solid #475569;
        border-radius: 8px;
        background: #1e293b;
        color: #f8fafc;
        box-shadow: 0 12px 32px rgb(0 0 0 / 30%);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -150%);
        transition: opacity 180ms ease, transform 180ms ease;
      }
      .save-toast.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .save-toast-message {
        display: block;
        padding: 0.9rem 1rem;
      }
      .save-toast-progress {
        height: 3px;
        background: #334155;
      }
      .save-toast-progress-bar {
        width: 100%;
        height: 100%;
        background: #4ade80;
        transform-origin: left;
      }
      .save-toast.is-visible .save-toast-progress-bar {
        animation: save-toast-countdown 2.5s linear forwards;
      }
      @keyframes save-toast-countdown {
        to {
          transform: scaleX(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="saveStatus" class="save-toast" role="status" aria-live="polite" aria-atomic="true">
      <span id="saveStatusMessage" class="save-toast-message"></span>
      <div class="save-toast-progress" aria-hidden="true">
        <div id="saveStatusProgress" class="save-toast-progress-bar"></div>
      </div>
    </div>
    <main>
      <h1>Ajustes</h1>
      <fieldset>
        <legend>Al abrir un PDF</legend>
        <label>
          <input type="radio" name="pdf-open-mode" value="same" />
          Abrir en la ventana actual
        </label>
        <label>
          <input type="radio" name="pdf-open-mode" value="new" />
          Abrir cada PDF en una ventana nueva
        </label>
      </fieldset>
      <p id="saveStatus" class="save-status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const modeOptions = document.querySelectorAll('input[name="pdf-open-mode"]');
      const saveStatus = document.getElementById("saveStatus");
      const saveStatusMessage = document.getElementById("saveStatusMessage");
      const saveStatusProgress = document.getElementById("saveStatusProgress");
      let saveStatusTimeout;

      window.electronAPI.getPdfOpenMode().then((openInNewWindows) => {
        const value = openInNewWindows ? "new" : "same";
        document.querySelector(`input[value="${value}"]`).checked = true;
      });

      modeOptions.forEach((option) => {
        option.addEventListener("change", async () => {
          await window.electronAPI.setPdfOpenMode(option.value === "new");
          clearTimeout(saveStatusTimeout);
          saveStatus.classList.remove("is-visible");
          saveStatusProgress.style.animation = "none";
          void saveStatusProgress.offsetWidth;
          saveStatusProgress.style.animation = "";
          saveStatusMessage.textContent = "Cambios guardados";
          saveStatus.classList.add("is-visible");
          saveStatusTimeout = setTimeout(() => {
            saveStatus.classList.remove("is-visible");
            saveStatusMessage.textContent = "";
          }, 2500);
        });
      });
    </script>
  </body>
</html>
